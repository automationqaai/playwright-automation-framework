name: Playwright Nightly

on:
  schedule:
    - cron: "30 20 * * *"

  workflow_dispatch:

jobs:
  playwright-regression:
    name: Nightly Regression - ${{ matrix.browser }} - Shard ${{ matrix.shard }}/${{ matrix.total-shards }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            shard: 1
            total-shards: 2

          - browser: chromium
            shard: 2
            total-shards: 2

          - browser: firefox
            shard: 1
            total-shards: 1

          - browser: webkit
            shard: 1
            total-shards: 1

    env:
      BASE_URL: ${{ vars.BASE_URL }}
      TEST_ENV: ${{ vars.TEST_ENV }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Clean Allure results
        shell: bash
        run: rm -rf allure-results

      - name: Run regression tests
        run: npm run test:regression -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.total-shards }}

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-blob-report-${{ matrix.browser }}-shard-${{ matrix.shard }}-of-${{ matrix.total-shards }}
          path: blob-report/
          retention-days: 14

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-${{ matrix.browser }}-shard-${{ matrix.shard }}-of-${{ matrix.total-shards }}
          path: test-results/
          retention-days: 14

  playwright-report:
    name: Merge Nightly Playwright Reports
    needs:
      - playwright-regression
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download nightly blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload unified Nightly Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-unified-report
          path: playwright-report/
          retention-days: 14