name: Playwright CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run quality

      - name: Verify environment files are not committed
        shell: bash
        run: |
          forbidden_files=(
            ".env"
            ".env.local"
            ".env.development"
            ".env.test"
            ".env.production"
          )

          for file in "${forbidden_files[@]}"; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              echo "::error::$file must not be committed."
              exit 1
            fi
          done

  playwright-smoke:
    name: Smoke Tests
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ vars.BASE_URL }}
      TEST_ENV: ${{ vars.TEST_ENV }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Smoke tests
        run: npm run test:smoke

  playwright-regression:
    name: Regression - ${{ matrix.browser }} - Shard ${{ matrix.shard }}/${{ matrix.total-shards }}
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            shard: 1
            total-shards: 2

          - browser: chromium
            shard: 2
            total-shards: 2

          - browser: firefox
            shard: 1
            total-shards: 1

          - browser: webkit
            shard: 1
            total-shards: 1

    env:
      BASE_URL: ${{ vars.BASE_URL }}
      TEST_ENV: ${{ vars.TEST_ENV }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run regression tests
        run: npm run test:regression -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.total-shards }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-shard-${{ matrix.shard }}-of-${{ matrix.total-shards }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}-shard-${{ matrix.shard }}-of-${{ matrix.total-shards }}
          path: test-results/
          retention-days: 14
